<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBoy Emulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>GameBoy Emulator</h1>
        <p class="credits">Based on <a href="https://github.com/juchi/gameboy.js" target="_blank">gameboy.js</a> by Julien Chichignoud</p>
        
        <div class="gameboy">
            <div class="gameboy-screen">
                <canvas id="screen" width="160" height="144"></canvas>
            </div>
            <div class="gameboy-controls">
                <div class="dpad">
                    <button id="up" class="dpad-btn up">↑</button>
                    <button id="right" class="dpad-btn right">→</button>
                    <button id="down" class="dpad-btn down">↓</button>
                    <button id="left" class="dpad-btn left">←</button>
                </div>
                <div class="action-buttons">
                    <button id="b" class="action-btn">B</button>
                    <button id="a" class="action-btn">A</button>
                </div>
                <div class="menu-buttons">
                    <button id="select" class="menu-btn">SELECT</button>
                    <button id="start" class="menu-btn">START</button>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <div class="status-container">
                <span id="status">Ready to load ROM</span>
                <span id="game-name"></span>
            </div>
            <div class="error-container">
                <div id="error" class="hide"></div>
            </div>
            <div class="control-buttons">
                <label for="file" class="btn load-rom">
                    Load ROM
                    <input type="file" id="file" accept=".gb,.gbc" hidden>
                </label>
                <button id="pause" class="btn">Pause</button>
                <button id="sound" class="btn">Sound: Off</button>
            </div>
        </div>
    </div>

    <script src="gameboy.js"></script>
    <script>
        // Fix for boot ROM loading function
        function loadboot(p) {
            if (!p || !p.memory) {
                console.error("CPU or memory not initialized");
                return;
            }
            
            var boot = [
                0x31, 0xFE, 0xFF, 0xAF, 0x21, 0xFF, 0x9F, 0x32, 0xCB, 0x7C, 0x20, 0xFB, 0x21, 0x26, 0xFF, 0x0E,
                0x11, 0x3E, 0x80, 0x32, 0xE2, 0x0C, 0x3E, 0xF3, 0xE2, 0x32, 0x3E, 0x77, 0x77, 0x3E, 0xFC, 0xE0,
                0x47, 0x11, 0x04, 0x01, 0x21, 0x10, 0x80, 0x1A, 0xCD, 0x95, 0x00, 0xCD, 0x96, 0x00, 0x13, 0x7B,
                0xFE, 0x34, 0x20, 0xF3, 0x11, 0xD8, 0x00, 0x06, 0x08, 0x1A, 0x13, 0x22, 0x23, 0x05, 0x20, 0xF9,
                0x3E, 0x19, 0xEA, 0x10, 0x99, 0x21, 0x2F, 0x99, 0x0E, 0x0C, 0x3D, 0x28, 0x08, 0x32, 0x0D, 0x20,
                0xF9, 0x2E, 0x0F, 0x18, 0xF3, 0x67, 0x3E, 0x64, 0x57, 0xE0, 0x42, 0x3E, 0x91, 0xE0, 0x40, 0x04,
                0x1E, 0x02, 0x0E, 0x0C, 0xF0, 0x44, 0xFE, 0x90, 0x20, 0xFA, 0x0D, 0x20, 0xF7, 0x1D, 0x20, 0xF2,
                0x0E, 0x13, 0x24, 0x7C, 0x1E, 0x83, 0xFE, 0x62, 0x28, 0x06, 0x1E, 0xC1, 0xFE, 0x64, 0x20, 0x06,
                0x7B, 0xE2, 0x0C, 0x3E, 0x87, 0xE2, 0xF0, 0x42, 0x90, 0xE0, 0x42, 0x15, 0x20, 0xD2, 0x05, 0x20,
                0x4F, 0x16, 0x20, 0x18, 0xCB, 0x4F, 0x06, 0x04, 0xC5, 0xCB, 0x11, 0x17, 0xC1, 0xCB, 0x11, 0x17,
                0x05, 0x20, 0xF5, 0x22, 0x23, 0x22, 0x23, 0xC9, 0xCE, 0xED, 0x66, 0x66, 0xCC, 0x0D, 0x00, 0x0B,
                0x03, 0x73, 0x00, 0x83, 0x00, 0x0C, 0x00, 0x0D, 0x00, 0x08, 0x11, 0x1F, 0x88, 0x89, 0x00, 0x0E,
                0xDC, 0xCC, 0x6E, 0xE6, 0xDD, 0xDD, 0xD9, 0x99, 0xBB, 0xBB, 0x67, 0x63, 0x6E, 0x0E, 0xEC, 0xCC,
                0xDD, 0xDC, 0x99, 0x9F, 0xBB, 0xB9, 0x33, 0x3E, 0x3C, 0x42, 0xB9, 0xA5, 0xB9, 0xA5, 0x42, 0x3C,
                0x21, 0x04, 0x01, 0x11, 0xA8, 0x00, 0x1A, 0x13, 0xBE, 0x00, 0x00, 0x23, 0x7D, 0xFE, 0x34, 0x20,
                0xF5, 0x06, 0x19, 0x78, 0x86, 0x23, 0x05, 0x20, 0xFB, 0x86, 0x00, 0x00, 0x3E, 0x01, 0xE0, 0x50
            ];

            for (var i in boot) {
                p.memory[i] = boot[i];
            }
            p.r.pc = 0;
            p.usingBootRom = true;
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Make sure GameboyJS exists
            if (typeof GameboyJS === 'undefined') {
                document.getElementById('error').classList.remove('hide');
                document.getElementById('error').textContent = 'GameBoy emulator failed to load. Please check console for details.';
                console.error('GameboyJS is not defined. Check if gameboy.js was loaded correctly.');
                return;
            }

            // Ensure Memory.addresses exists and add missing properties
            if (!GameboyJS.Memory.addresses) {
                GameboyJS.Memory.addresses = {
                    VRAM_START: 0x8000,
                    VRAM_END: 0x9FFF,
                    EXTRAM_START: 0xA000,
                    EXTRAM_END: 0xBFFF,
                    OAM_START: 0xFE00,
                    OAM_END: 0xFE9F,
                    DEVICE_START: 0xFF00,
                    DEVICE_END: 0xFF7F
                };
            }
            
            // Fix for Memory addresses
            GameboyJS.Memory.addresses.DEVICERAM_START = GameboyJS.Memory.addresses.DEVICE_START;
            GameboyJS.Memory.addresses.DEVICERAM_END = GameboyJS.Memory.addresses.DEVICE_END;

            try {
                // Initialize the GameBoy
                const canvas = document.getElementById('screen');
                const gameboy = new GameboyJS.Gameboy(canvas, {
                    zoom: 1
                });

                // Set up status display
                const statusElement = document.getElementById('status');
                const gameNameElement = document.getElementById('game-name');
                const errorElement = document.getElementById('error');

                // Setup ROM loading
                const fileInput = document.getElementById('file');
                fileInput.addEventListener('change', function(e) {
                    if (e.target.files.length > 0) {
                        statusElement.textContent = 'Loading ROM...';
                        errorElement.classList.add('hide');
                    }
                });
                
                // Load boot ROM
                loadboot(gameboy.cpu);

                // Set up UI controls
                const pauseButton = document.getElementById('pause');
                pauseButton.addEventListener('click', function() {
                    if (pauseButton.textContent === 'Pause') {
                        gameboy.pause(true);
                        pauseButton.textContent = 'Resume';
                    } else {
                        gameboy.pause(false);
                        pauseButton.textContent = 'Pause';
                    }
                });

                const soundButton = document.getElementById('sound');
                soundButton.addEventListener('click', function() {
                    if (soundButton.textContent === 'Sound: Off') {
                        gameboy.setSoundEnabled(true);
                        soundButton.textContent = 'Sound: On';
                    } else {
                        gameboy.setSoundEnabled(false);
                        soundButton.textContent = 'Sound: Off';
                    }
                });

                // Physical button controls
                const buttons = [
                    { id: 'up', key: 'UP' },
                    { id: 'down', key: 'DOWN' },
                    { id: 'left', key: 'LEFT' },
                    { id: 'right', key: 'RIGHT' },
                    { id: 'a', key: 'A' },
                    { id: 'b', key: 'B' },
                    { id: 'select', key: 'SELECT' },
                    { id: 'start', key: 'START' }
                ];

                buttons.forEach(button => {
                    const el = document.getElementById(button.id);
                    if (el) {
                        el.addEventListener('mousedown', () => gameboy.input.pressKey(button.key));
                        el.addEventListener('mouseup', () => gameboy.input.releaseKey(button.key));
                        el.addEventListener('touchstart', (e) => {
                            e.preventDefault();
                            gameboy.input.pressKey(button.key);
                        });
                        el.addEventListener('touchend', (e) => {
                            e.preventDefault();
                            gameboy.input.releaseKey(button.key);
                        });
                    }
                });
            } catch (e) {
                document.getElementById('error').classList.remove('hide');
                document.getElementById('error').textContent = 'Error initializing GameBoy: ' + e.message;
                console.error('GameBoy initialization error:', e);
            }
        });
    </script>

</body>
</html>
