<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBoy Emulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>GameBoy Emulator</h1>
        <p class="credits">Based on <a href="https://github.com/juchi/gameboy.js" target="_blank">gameboy.js</a> by Julien Chichignoud</p>
        
        <div class="gameboy">
            <div class="gameboy-screen">
                <canvas id="screen" width="160" height="144"></canvas>
            </div>
            <div class="gameboy-controls">
                <div class="dpad">
                    <button id="up" class="dpad-btn up">↑</button>
                    <button id="right" class="dpad-btn right">→</button>
                    <button id="down" class="dpad-btn down">↓</button>
                    <button id="left" class="dpad-btn left">←</button>
                </div>
                <div class="action-buttons">
                    <button id="b" class="action-btn">B</button>
                    <button id="a" class="action-btn">A</button>
                </div>
                <div class="menu-buttons">
                    <button id="select" class="menu-btn">SELECT</button>
                    <button id="start" class="menu-btn">START</button>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <div class="status-container">
                <span id="status">Ready to load ROM</span>
                <span id="game-name"></span>
            </div>
            <div class="error-container">
                <div id="error" class="hide"></div>
            </div>
            <div class="control-buttons">
                <label for="file" class="btn load-rom">
                    Load ROM
                    <input type="file" id="file" accept=".gb,.gbc" hidden>
                </label>
                <button id="pause" class="btn">Pause</button>
                <button id="sound" class="btn">Sound: Off</button>
            </div>
        </div>
    </div>

    <script src="gameboy.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Fix for Memory addressess
            GameboyJS.Memory.addresses.DEVICERAM_START = GameboyJS.Memory.addresses.DEVICE_START;
            GameboyJS.Memory.addresses.DEVICERAM_END = GameboyJS.Memory.addresses.DEVICE_END;

            // Initialize the GameBoy
            const canvas = document.getElementById('screen');
            const gameboy = new GameboyJS.Gameboy(canvas, {
                zoom: 1
            });

            // Setup ROM loading
            const fileInput = document.getElementById('file');
            
            // Load boot ROM
            loadboot(gameboy.cpu);

            // Set up UI controls
            const pauseButton = document.getElementById('pause');
            pauseButton.addEventListener('click', function() {
                if (pauseButton.textContent === 'Pause') {
                    gameboy.pause(true);
                    pauseButton.textContent = 'Resume';
                } else {
                    gameboy.pause(false);
                    pauseButton.textContent = 'Pause';
                }
            });

            const soundButton = document.getElementById('sound');
            soundButton.addEventListener('click', function() {
                if (soundButton.textContent === 'Sound: Off') {
                    gameboy.setSoundEnabled(true);
                    soundButton.textContent = 'Sound: On';
                } else {
                    gameboy.setSoundEnabled(false);
                    soundButton.textContent = 'Sound: Off';
                }
            });

            // Physical button controls
            const buttons = [
                { id: 'up', key: 'UP' },
                { id: 'down', key: 'DOWN' },
                { id: 'left', key: 'LEFT' },
                { id: 'right', key: 'RIGHT' },
                { id: 'a', key: 'A' },
                { id: 'b', key: 'B' },
                { id: 'select', key: 'SELECT' },
                { id: 'start', key: 'START' }
            ];

            buttons.forEach(button => {
                const el = document.getElementById(button.id);
                el.addEventListener('mousedown', () => gameboy.input.pressKey(button.key));
                el.addEventListener('mouseup', () => gameboy.input.releaseKey(button.key));
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    gameboy.input.pressKey(button.key);
                });
                el.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    gameboy.input.releaseKey(button.key);
                });
            });
        });
    </script>

</body>
</html>
